# 一個 PostgreSQL，加上接上它的 Server。
#
# Server 走 stdio，不是常駐服務，所以用 `run` 而不是 `up`：
#
#   docker compose run --rm -T mcp
#
# `-T` 關掉 TTY，stdin／stdout 才是乾淨的管子。只想要資料庫的話：`docker compose up -d db`。

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcp -d mcp']
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: .
    image: project-mcp:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mcp:mcp@db:5432/mcp
    stdin_open: true
    tty: false
