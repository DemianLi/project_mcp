# 一個 PostgreSQL，加上接上它的 Server。
#
# Server 走 stdio，不是常駐服務，所以用 `run` 而不是 `up`：
#
#   docker compose run --rm -T mcp
#
# `-T` 關掉 TTY，stdin／stdout 才是乾淨的管子。只想要資料庫的話：`docker compose up -d db`。
# 用 Inspector 連這一套：`npm run inspect:docker`。

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 的 PGDATA 是 /var/lib/postgresql/18/docker，image 宣告的 volume 是它的
      # 上一層。照舊慣例掛 /var/lib/postgresql/data 不會報錯，但那不是資料所在，`down` 之後
      # 資料就沒了。
      - db-data:/var/lib/postgresql
      # 資料庫第一次建立時自動套用。volume 已經有資料就不會再跑——要重來就 `down -v`。
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcp -d mcp']
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: .
    image: project-mcp:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mcp:mcp@db:5432/mcp
    stdin_open: true
    tty: false

volumes:
  db-data:
