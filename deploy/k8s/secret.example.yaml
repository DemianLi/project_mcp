# 範本。實際部署請換成甲方的 Secret 管理方式（External Secrets、Sealed Secrets 之類），
# 不要把真的值放進版控。
#
# 產生 requestState 的金鑰：
#   openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: project-mcp
type: Opaque
stringData:
  # PostgreSQL 連線字串。
  DATABASE_URL: postgres://mcp:CHANGE_ME@postgres:5432/mcp
  # 多回合流程的狀態金鑰，至少 32 bytes。每個副本必須是同一把。
  REQUEST_STATE_SECRET: CHANGE_ME_at_least_32_bytes_long_secret
