# stdout carries JSON-RPC protocol. Keep all output off it.
spring:
  main:
    banner-mode: off
    web-application-type: none
  ai:
    mcp:
      server:
        type: SYNC
        name: project-mcp
        # Filled in by Maven at package time with @project.version@.
        version: @project.version@
        # Only Tools are offered: resources, prompts and completions are off.
        # See docs/design.md#why-there-are-no-resources. The logging capability is still
        # declared, because it cannot be switched off here; this Server never sends a log
        # notification — its logs go to the file configured below.
        capabilities:
          resource: false
          prompt: false
          completion: false

logging:
  file:
    name: logs/project-mcp.log
  threshold:
    console: "OFF"
  structured:
    format:
      # Elastic Common Schema. See docs/design.md#logging.
      file: ecs
    ecs:
      service:
        name: project-mcp
  level:
    # Suppress Spring AI bean post-processing warnings
    "[org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker]": ERROR
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
