# stdout 承載 JSON-RPC 協定，任何其他輸出都不得寫到 stdout。
spring:
  main:
    banner-mode: off
    web-application-type: none
  ai:
    mcp:
      server:
        type: SYNC
        name: project-mcp
        # 打包時由 Maven 以 @project.version@ 填入。
        version: @project.version@
        # 只提供 Tools：resources、prompts、completions 皆關閉，
        # 見 docs/design.md#why-there-are-no-resources。logging capability 在此無法關閉，
        # 因此仍會宣告；但本 Server 從不送出 log notification，log 只寫入下方設定的檔案。
        capabilities:
          resource: false
          prompt: false
          completion: false

logging:
  file:
    name: logs/project-mcp.log
  threshold:
    console: "OFF"
  structured:
    format:
      # Elastic Common Schema，見 docs/design.md#logging。
      file: ecs
    ecs:
      service:
        name: project-mcp
  level:
    # 關掉 Spring AI 的 bean post-processing 警告。
    "[org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker]": ERROR
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
